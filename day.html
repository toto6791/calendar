<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2B4C7E">
  <title>Ден</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body class="page-day">
  <header class="day-bar">
    <a class="back-link" id="backLink" href="index.html">‹ Календар</a>
    <div class="day-arrows">
      <a class="nav-btn" id="prevDay" href="#" aria-label="Предишен ден">‹</a>
      <a class="nav-btn" id="nextDay" href="#" aria-label="Следващ ден">›</a>
    </div>
  </header>

  <main class="day">
    <section class="day-head">
      <p class="day-number" id="dayNumber">1</p>
      <div>
        <p class="day-weekday" id="dayWeekday">Понеделник</p>
        <p class="day-month" id="dayMonth">януари 2026</p>
      </div>
    </section>

    <p class="sync-status" id="syncStatus"></p>

    <section class="events" aria-labelledby="eventsTitle">
      <div class="events-head">
        <h2 id="eventsTitle" class="section-title">Събития</h2>
        <label class="filter">
          <span>Покажи:</span>
          <select id="filterSel" aria-label="Кои събития да се показват"></select>
        </label>
      </div>
      <ul class="event-list" id="eventList"></ul>
      <p class="empty" id="emptyMsg">Няма събития за този ден. Добавете първото по-долу.</p>
      <p class="hidden-note" id="hiddenNote" hidden></p>
    </section>

    <form class="event-form" id="eventForm" autocomplete="off">
      <h2 class="section-title">Ново събитие</h2>
      <p class="author-line" id="authorLine" hidden>
        Добавяте като <b id="authorName"></b>
        <button type="button" class="cal-link" id="changeName">Смени</button>
      </p>
      <label class="field" id="nameField">
        <span>Вашето име</span>
        <input type="text" id="authorInput" name="author" maxlength="40" placeholder="Напр. Мария"
          autocomplete="given-name">
      </label>
      <fieldset class="field time-field">
        <legend>Час</legend>
        <div class="time-selects">
          <select id="eventHour" name="hour" aria-label="Час">
            <option value="">цял ден</option>
            <option value="00">00</option>
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
          </select>
          <span class="time-sep">:</span>
          <select id="eventMinute" name="minute" aria-label="Минути">
            <option value="00">00</option>
            <option value="05">05</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="35">35</option>
            <option value="40">40</option>
            <option value="45">45</option>
            <option value="50">50</option>
            <option value="55">55</option>
          </select>
        </div>
      </fieldset>
      <label class="field">
        <span>Заглавие</span>
        <input type="text" id="eventTitle" name="title" maxlength="120" required placeholder="Напр. Среща с Иван">
      </label>
      <label class="field">
        <span>Бележка</span>
        <textarea id="eventNote" name="note" rows="2" maxlength="500" placeholder="По желание"></textarea>
      </label>
      <button type="submit" class="primary-btn">Добави събитие</button>
    </form>
  </main>

  <script src="js/github.js?v=7"></script>
  <script src="js/storage.js?v=7"></script>
  <script src="js/who.js?v=7"></script>
  <script src="js/dates.js?v=7"></script>
  <script src="js/phonecal.js?v=7"></script>
  <script src="js/day.js?v=7"></script>
  <script src="js/syncstatus.js?v=7"></script>
</body>
</html>
